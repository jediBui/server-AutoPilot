---
- name: Provision Ubuntu VM
  hosts: localhost
  connection: local
  become: true
  vars:
    github_username: jediBui
    rdp_port: 3389
    starship_theme: catppuccin-frappe
    font_size: 13
    target_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    user_home: "{{ '/home/' + target_user if target_user != 'root' else '/root' }}"

  pre_tasks:
    - name: Verify running as root
      assert:
        that: ansible_facts["user_id"] == "root"
        fail_msg: "This playbook must be run as root (via sudo)"

    # ── Stale repo cleanup ────────────────────────────────────────────────────
    # Must happen before any apt task. Leftover Ansible PPA or Chrome list
    # files cause apt-get update to exit non-zero on Ubuntu 26.04 (Resolute),
    # which propagates into every subsequent apt module call.

    - name: Remove stale Ansible PPA sources (not published for Resolute)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/ansible-ubuntu-ansible-resolute.list
        - /etc/apt/sources.list.d/ansible-ubuntu-ansible-resolute.sources
        # Catch any release-codename variant left by add-apt-repository
        - /etc/apt/sources.list.d/ansible-ubuntu-ansible-noble.list
        - /etc/apt/sources.list.d/ansible-ubuntu-ansible-noble.sources

    - name: Remove stale Chrome repo/keyring files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/google-chrome-stable.list
        - /etc/apt/sources.list.d/google-chrome.list
        - /usr/share/keyrings/google-chrome.asc
        - /usr/share/keyrings/google-chrome.gpg

    - name: Update apt cache (clean slate)
      apt:
        update_cache: yes
        cache_valid_time: 0   # force refresh after removing stale sources

    # ── GUI Detection ─────────────────────────────────────────────────────────
    # Three independent signals; any one positive sets has_gui = true.
    # Ubuntu 26.04 ships GDM3 by default on desktop images.

    - name: Check if a display manager service is active
      shell: >
        systemctl is-active --quiet gdm3 ||
        systemctl is-active --quiet gdm  ||
        systemctl is-active --quiet lightdm ||
        systemctl is-active --quiet sddm ||
        systemctl is-active --quiet xdm
      register: dm_active
      failed_when: false
      changed_when: false

    - name: Check if desktop packages are installed
      shell: >
        dpkg -l ubuntu-desktop gnome-shell xfce4 kde-plasma-desktop lxde-core 2>/dev/null |
        grep -qE '^ii'
      register: desktop_pkgs
      failed_when: false
      changed_when: false

    - name: Check for an active graphical display environment variable
      shell: >
        [ -n "${DISPLAY:-}" ] || [ -n "${WAYLAND_DISPLAY:-}" ]
      register: display_env
      failed_when: false
      changed_when: false

    - name: Set has_gui fact
      set_fact:
        has_gui: "{{
          dm_active.rc == 0 or
          desktop_pkgs.rc == 0 or
          display_env.rc == 0
        }}"

    - name: Report GUI detection result
      debug:
        msg: >-
          GUI detected: {{ has_gui }}.
          {% if not has_gui %}
          Headless/server mode — Chrome and xrdp will be skipped.
          {% else %}
          Full desktop provisioning will run.
          {% endif %}

  tasks:
    # ── SSH Keys ──────────────────────────────────────────────────────────────
    - name: Fetch SSH keys from GitHub
      uri:
        url: "https://github.com/{{ github_username }}.keys"
        return_content: yes
        status_code: 200
      register: github_keys
      retries: 3
      delay: 5

    - name: Ensure .ssh directory exists for target user
      file:
        path: "{{ user_home }}/.ssh"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0700"

    - name: Write GitHub SSH keys to authorized_keys
      copy:
        content: "{{ github_keys.content }}"
        dest: "{{ user_home }}/.ssh/authorized_keys"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"

    # ── Core Packages ─────────────────────────────────────────────────────────
    # gnome-tweaks removed from headless installs in 26.04 minimal; safe to
    # keep here because apt will simply skip it if the desktop isn't present.
    - name: Install core packages
      apt:
        name:
          - curl
          - git
          - openssh-server
          - fzf
          - ufw
          - qemu-guest-agent
          - wget
          - unzip
          - fontconfig
          - dconf-cli
          - gnome-tweaks
          - openssl
        state: present
        update_cache: no

    # ── SSH hardening ─────────────────────────────────────────────────────────
    # Ubuntu 26.04 ships OpenSSH 9.x which splits config across
    # /etc/ssh/sshd_config and drop-ins under /etc/ssh/sshd_config.d/.
    # Writing a drop-in is the canonical approach going forward.

    - name: Write SSH hardening drop-in
      copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible — do not edit manually
          PasswordAuthentication no
          ChallengeResponseAuthentication no
          PubkeyAuthentication yes
      notify: Restart SSH

    # ── Google Chrome (GUI only) ───────────────────────────────────────────────
    # Uses the official .deb from Google's repo. The install script is written
    # as a shell file to keep the GPG key fetch and apt source setup atomic.
    # apt-get update inside the script is scoped to only the Chrome source to
    # avoid choking on any other broken repo on the system.

    - name: Write Google Chrome install script
      copy:
        dest: /tmp/install-chrome.sh
        mode: "0755"
        content: |
          #!/bin/bash
          set -euo pipefail

          KEYRING=/usr/share/keyrings/google-chrome.gpg
          LIST=/etc/apt/sources.list.d/google-chrome.list

          # Add GPG key
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor -o "${KEYRING}"
          chmod 644 "${KEYRING}"

          # Add repo source
          echo "deb [arch=amd64 signed-by=${KEYRING}] \
          https://dl.google.com/linux/chrome/deb/ stable main" \
            > "${LIST}"

          # Update only the Chrome repo to avoid noise from other sources
          apt-get update -qq \
            -o Dir::Etc::sourcelist="${LIST}" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup=0

          apt-get install -y google-chrome-stable

          # Remove the auto-generated stable list Google's postinst drops in
          rm -f /etc/apt/sources.list.d/google-chrome-stable.list \
                /usr/share/keyrings/google-chrome.asc
      when: has_gui

    - name: Install Google Chrome
      command: /tmp/install-chrome.sh
      args:
        creates: /usr/bin/google-chrome-stable
      when: has_gui

    # ── UFW Firewall ──────────────────────────────────────────────────────────
    - name: Configure UFW — GUI system (SSH + RDP)
      shell: |
        ufw --force reset
        ufw default deny incoming
        ufw default allow outgoing
        ufw allow 22/tcp    comment 'SSH'
        ufw allow {{ rdp_port }}/tcp comment 'RDP'
        ufw --force enable
      changed_when: true
      when: has_gui

    - name: Configure UFW — headless/server (SSH only)
      shell: |
        ufw --force reset
        ufw default deny incoming
        ufw default allow outgoing
        ufw allow 22/tcp comment 'SSH'
        ufw --force enable
      changed_when: true
      when: not has_gui

    # ── QEMU Guest Agent ──────────────────────────────────────────────────────
    - name: Enable and start qemu-guest-agent
      systemd:
        name: qemu-guest-agent
        enabled: yes
        state: started
      ignore_errors: yes

    # ── RDP via XRDP (GUI only) ───────────────────────────────────────────────
    # xorgxrdp requires Xorg; on Ubuntu 26.04 desktop (Wayland default) this
    # is still available as xserver-xorg. XRDP forces an X11 session via
    # .xsession, so Wayland is not required for RDP to work.

    - name: Install xrdp
      apt:
        name:
          - xrdp
          - xorgxrdp
        state: present
      when: has_gui

    - name: Set xrdp listen port to {{ rdp_port }}
      lineinfile:
        path: /etc/xrdp/xrdp.ini
        regexp: "^port="
        line: "port={{ rdp_port }}"
        backup: yes
      notify: Restart xrdp
      when: has_gui

    - name: Add xrdp user to ssl-cert group (fixes TLS errors)
      user:
        name: xrdp
        groups: ssl-cert
        append: yes
      when: has_gui

    - name: Write .xsession to force GNOME/X11 for RDP sessions
      copy:
        dest: "{{ user_home }}/.xsession"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"
        content: |
          export GNOME_SHELL_SESSION_MODE=ubuntu
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=ubuntu:GNOME
          exec /usr/bin/gnome-session
      when: has_gui

    - name: Enable and start xrdp
      systemd:
        name: xrdp
        enabled: yes
        state: started
      when: has_gui

    # ── SF Mono Nerd Font ─────────────────────────────────────────────────────
    - name: Create fonts directory
      file:
        path: /usr/local/share/fonts/SFMonoNerd
        state: directory
        mode: "0755"

    - name: Clone SF-Mono-Nerd-Font repository
      git:
        repo: https://github.com/epk/SF-Mono-Nerd-Font.git
        dest: /tmp/SF-Mono-Nerd-Font
        depth: 1

    - name: Copy Regular font files
      shell: |
        find /tmp/SF-Mono-Nerd-Font \
          \( -iname "*Regular*.ttf" -o -iname "*Regular*.otf" \) \
          -type f \
          -exec cp {} /usr/local/share/fonts/SFMonoNerd/ \;
      args:
        creates: /usr/local/share/fonts/SFMonoNerd/.installed

    - name: Mark fonts as installed
      file:
        path: /usr/local/share/fonts/SFMonoNerd/.installed
        state: touch

    - name: Rebuild font cache
      command: fc-cache -fv
      changed_when: false

    # ── Starship Prompt ───────────────────────────────────────────────────────
    - name: Check if Starship is already installed
      stat:
        path: /usr/local/bin/starship
      register: starship_binary

    - name: Install Starship
      shell: curl -fsSL https://starship.rs/install.sh | sh -s -- --yes
      when: not starship_binary.stat.exists
      args:
        creates: /usr/local/bin/starship

    - name: Ensure starship config directory exists
      file:
        path: "{{ user_home }}/.config"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"

    - name: Download Catppuccin Frappe starship theme
      shell: |
        curl -fsSL --retry 3 --retry-delay 5 --max-time 30 \
          "https://raw.githubusercontent.com/catppuccin/starship/main/themes/frappe.toml" \
          -o "{{ user_home }}/.config/starship.toml"
        chown {{ target_user }}:{{ target_user }} "{{ user_home }}/.config/starship.toml"
        chmod 644 "{{ user_home }}/.config/starship.toml"
      args:
        creates: "{{ user_home }}/.config/starship.toml"

    - name: Initialise Starship in .bashrc
      blockinfile:
        path: "{{ user_home }}/.bashrc"
        marker: "# {mark} STARSHIP PROMPT"
        block: |
          export STARSHIP_CONFIG="$HOME/.config/starship.toml"
          eval "$(starship init bash)"
        create: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"

    - name: Source .bashrc from .bash_profile (login shells)
      blockinfile:
        path: "{{ user_home }}/.bash_profile"
        marker: "# {mark} BASHRC SOURCE"
        block: |
          [[ -f ~/.bashrc ]] && source ~/.bashrc
        create: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"

    # ── Terminal font configuration (GUI only) ────────────────────────────────
    # dconf requires a running D-Bus session and cannot be applied during
    # provisioning. A helper script is dropped for the user to run post-login.

    - name: Detect installed terminal emulator
      shell: >
        command -v gnome-terminal ||
        command -v kgx ||
        command -v xterm ||
        echo none
      register: terminal_bin
      changed_when: false
      when: has_gui

    - name: Write terminal font helper script
      copy:
        dest: "{{ user_home }}/.config/set-terminal-font.sh"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"
        content: |
          #!/bin/bash
          # Run once after first graphical login to apply the terminal font.
          set -euo pipefail
          FONT="SFMono Nerd Font Regular {{ font_size }}"

          if command -v gnome-terminal &>/dev/null; then
            PROFILE=$(gsettings get org.gnome.Terminal.ProfilesList default | tr -d "'")
            dconf write /org/gnome/terminal/legacy/profiles:/:${PROFILE}/font "'${FONT}'"
            dconf write /org/gnome/terminal/legacy/profiles:/:${PROFILE}/use-system-font "false"
            echo "gnome-terminal: font set to '${FONT}'"
          elif command -v kgx &>/dev/null; then
            gsettings set org.gnome.Console custom-font "'${FONT}'"
            gsettings set org.gnome.Console use-system-font false
            echo "GNOME Console: font set to '${FONT}'"
          else
            echo "No supported terminal found — set the font manually."
          fi
      when: has_gui

    - name: Remind user to run font script after login (GUI)
      debug:
        msg: >-
          Terminal detected: {{ terminal_bin.stdout | default('unknown') }}.
          Run after your first login: bash ~/.config/set-terminal-font.sh
      when: has_gui and terminal_bin is defined

    - name: Note — headless mode, GUI tasks skipped
      debug:
        msg: >-
          Headless/server mode — Chrome, xrdp, and terminal font setup skipped.
      when: not has_gui

  # ── Handlers ─────────────────────────────────────────────────────────────────
  handlers:
    - name: Restart SSH
      systemd:
        # Ubuntu 26.04 uses 'ssh' as the service name (not 'sshd')
        name: ssh
        state: restarted

    - name: Restart xrdp
      systemd:
        name: xrdp
        state: restarted
